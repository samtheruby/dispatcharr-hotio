name: Update and build Dispatcharr Hotio

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: dispatcharr-hotio-${{ github.ref == 'refs/heads/main' && 'publish' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Check release tracking and shell syntax
        run: |
          python3 -m unittest discover -s tests -v
          for script in tests/*.sh scripts/*.sh; do
            bash -n "$script"
          done

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Track latest stable release and Hotio base
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digest=$(docker buildx imagetools inspect ghcr.io/hotio/base:noblevpn --format '{{.Manifest.Digest}}')
          python3 scripts/update.py "$digest"
          publish=false
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == refs/heads/main ]]; then
            publish=true
          fi
          if [[ "$publish" == true ]] && ! git diff --quiet -- meta.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add meta.json
            git commit -m "chore(deps): track Dispatcharr $(jq -r .version meta.json) and Hotio base"
            git push
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          fingerprint=$(git ls-files -z | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
          marker="${image}:build-${fingerprint}"
          {
            echo "image=$image"
            echo "marker=$marker"
            echo "publish=$publish"
            echo "version=$(jq -r .version meta.json)"
            echo "revision=$(jq -r .revision meta.json)"
            echo "base_digest=$(jq -r .base_digest meta.json)"
            echo "upstream_image=$(jq -r .upstream_image meta.json)"
            echo "ffmpeg_revision=$(jq -r .ffmpeg_revision meta.json)"
          } >> "$GITHUB_OUTPUT"
          if [[ "$publish" == true ]] && docker buildx imagetools inspect "$marker" >/dev/null 2>&1; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Free runner space for native builds
        if: steps.update.outputs.build == 'true'
        run: |
          # These preinstalled toolchains are unused by the container build.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Check out Dispatcharr release build recipe
        if: steps.update.outputs.build == 'true'
        uses: actions/checkout@v7
        with:
          repository: Dispatcharr/Dispatcharr
          ref: ${{ steps.update.outputs.revision }}
          path: source/dispatcharr
          persist-credentials: false

      - name: Check out the release's FFmpeg source
        if: steps.update.outputs.build == 'true'
        uses: actions/checkout@v7
        with:
          repository: Dispatcharr/FFmpeg
          ref: ${{ steps.update.outputs.ffmpeg_revision }}
          path: source/ffmpeg
          persist-credentials: false

      - name: Adapt upstream runtime recipes for Ubuntu 24.04
        if: steps.update.outputs.build == 'true'
        run: python3 scripts/prepare_runtime.py

      - name: Verify unsupported bases block building
        if: steps.update.outputs.build == 'true'
        run: bash tests/test-compatibility.sh

      - name: Build runtime and package release on Hotio
        if: steps.update.outputs.build == 'true'
        uses: docker/bake-action@v7
        env:
          IMAGE: dispatcharr-hotio:test
          VERSION: ${{ steps.update.outputs.version }}
          REVISION: ${{ steps.update.outputs.revision }}
          BASE_DIGEST: ${{ steps.update.outputs.base_digest }}
          UPSTREAM_IMAGE: ${{ steps.update.outputs.upstream_image }}
          FFMPEG_REVISION: ${{ steps.update.outputs.ffmpeg_revision }}
        with:
          source: .
          targets: app
          load: true
          set: |
            *.cache-from=type=registry,ref=${{ steps.update.outputs.image }}:buildcache
            app.cache-to=${{ steps.update.outputs.publish == 'true' && format('type=registry,ref={0}:buildcache,mode=max', steps.update.outputs.image) || 'type=gha,scope=hotio-preview,mode=max' }}

      - name: Verify release files, rebuilt runtime, and container lifecycle
        if: steps.update.outputs.build == 'true'
        env:
          UPSTREAM_IMAGE: ${{ steps.update.outputs.upstream_image }}
        run: bash tests/test-image.sh dispatcharr-hotio:test "$UPSTREAM_IMAGE"

      - name: Publish tested image
        if: steps.update.outputs.build == 'true' && steps.update.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.update.outputs.image }}
          VERSION: ${{ steps.update.outputs.version }}
          MARKER: ${{ steps.update.outputs.marker }}
        run: |
          docker tag dispatcharr-hotio:test "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          docker tag dispatcharr-hotio:test "$IMAGE:latest"
          docker push "$IMAGE:latest"
          # Publish the completion marker last so failed publishing retries next scheduled check.
          docker tag dispatcharr-hotio:test "$MARKER"
          docker push "$MARKER"
          echo "Published $IMAGE:$VERSION and $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
